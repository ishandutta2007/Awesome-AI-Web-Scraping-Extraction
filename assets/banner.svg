<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.65; }
    }
    @keyframes scanline {
      0% { transform: translateY(-100px); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(380px); opacity: 0; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes dataStream {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes beaconPulse {
      0% { r: 4px; opacity: 1; }
      100% { r: 16px; opacity: 0; }
    }

    .bg-orb-1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 200px 100px; }
    .bg-orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate-reverse; transform-origin: 1000px 250px; }
    .scan-beam { animation: scanline 6s linear infinite; }
    .pill-float-1 { animation: floatPill1 4s ease-in-out infinite; }
    .pill-float-2 { animation: floatPill2 4.5s ease-in-out infinite; }
    .pill-float-3 { animation: floatPill1 5s ease-in-out infinite; }
    .data-wire { stroke-dasharray: 8 6; animation: dataStream 3s linear infinite; }
    .beacon { animation: beaconPulse 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Outer Border -->
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-opacity="0.6" stroke-width="1.5" />

  <!-- Dynamic Background Ambient Glow Orbs -->
  <g>
    <circle class="bg-orb-1" cx="220" cy="110" r="140" fill="#38bdf8" opacity="0.25" filter="url(#glow)" />
    <circle class="bg-orb-2" cx="980" cy="240" r="160" fill="#818cf8" opacity="0.25" filter="url(#glow)" />
    <circle cx="600" cy="320" r="110" fill="#c084fc" opacity="0.15" filter="url(#glow)" />
  </g>

  <!-- Technical Grid Pattern Background -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="250" y1="0" x2="250" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="550" y1="0" x2="550" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="850" y1="0" x2="850" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="1150" y1="0" x2="1150" y2="360" />
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Background Data Flow Lines -->
  <g opacity="0.4">
    <path class="data-wire" d="M 80 80 Q 300 20 600 80 T 1120 70" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path class="data-wire" d="M 80 290 Q 400 340 750 280 T 1120 300" fill="none" stroke="#818cf8" stroke-width="1.5" />
  </g>

  <!-- Scanning Light Line (Dynamic Visual Accent) -->
  <line class="scan-beam" x1="100" y1="0" x2="1100" y2="0" stroke="url(#primary-glow)" stroke-width="2" filter="url(#soft-glow)" />

  <!-- Interactive/Dynamic Tech Badges & Floating Nodes in Background Layer -->
  <g class="pill-float-1" opacity="0.85">
    <g transform="translate(90, 42)">
      <rect width="130" height="28" rx="14" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#38bdf8" />
      <circle class="beacon" cx="16" cy="14" stroke="#38bdf8" fill="none" stroke-width="1" />
      <text x="30" y="19" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">LLM-READY</text>
    </g>
  </g>

  <g class="pill-float-2" opacity="0.85">
    <g transform="translate(980, 50)">
      <rect width="140" height="28" rx="14" fill="url(#card-grad)" stroke="#c084fc" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#c084fc" />
      <text x="30" y="19" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">AGENT PIPELINES</text>
    </g>
  </g>

  <g class="pill-float-3" opacity="0.85">
    <g transform="translate(100, 290)">
      <rect width="135" height="28" rx="14" fill="url(#card-grad)" stroke="#34d399" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#34d399" />
      <text x="30" y="19" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">ANTI-BLOCK INFRA</text>
    </g>
  </g>

  <g class="pill-float-1" opacity="0.85">
    <g transform="translate(970, 282)">
      <rect width="150" height="28" rx="14" fill="url(#card-grad)" stroke="#fbbf24" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#fbbf24" />
      <text x="30" y="19" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">BROWSER AI CLOUD</text>
    </g>
  </g>

  <!-- FOREGROUND: TITLE & SUBTITLE (Always Crisply Visible) -->
  <!-- Top Category Tag -->
  <g transform="translate(600, 100)">
    <rect x="-140" y="-15" width="280" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text text-anchor="middle" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">CURATED AWESOME ECOSYSTEM</text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="165" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
    Awesome AI Web Scraping &amp; Extraction
  </text>

  <!-- Highlighting Accent Bar underneath Title -->
  <rect x="360" y="185" width="480" height="4" rx="2" fill="url(#primary-glow)" filter="url(#soft-glow)" />

  <!-- Subtitle Line 1 -->
  <text x="600" y="226" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="0.2">
    LLM-Ready Markdown Conversion • Enterprise Anti-Detection • Visual &amp; Autonomous Agents
  </text>

  <!-- Subtitle Line 2 (Key Ecosystem Pillars) -->
  <text x="600" y="258" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500">
    Firecrawl • Crawl4AI • Playwright • Scrapy • Browser-Use • Apify • Bright Data • Oxylabs • Zyte
  </text>

  <!-- Bottom Accent Dots -->
  <g fill="#475569" transform="translate(560, 310)">
    <circle cx="10" cy="0" r="3" fill="#38bdf8" />
    <circle cx="25" cy="0" r="3" fill="#818cf8" />
    <circle cx="40" cy="0" r="3" fill="#c084fc" />
    <circle cx="55" cy="0" r="3" fill="#34d399" />
    <circle cx="70" cy="0" r="3" fill="#f59e0b" />
  </g>
</svg>
