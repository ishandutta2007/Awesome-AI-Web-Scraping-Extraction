<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient><linearGradient id="primary-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cyan-glow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".2"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".7"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".85"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.15) translate(20px,-15px);opacity:.65}}@keyframes scanline{0%{transform:translateY(-100px);opacity:0}50%{opacity:.6}}@keyframes floatPill1{0%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes floatPill2{0%{transform:translateY(0)}50%{transform:translateY(7px)}}@keyframes dataStream{0%{stroke-dashoffset:100}}@keyframes beaconPulse{0%{r:4px;opacity:1}}.bg-orb-1{animation:pulseOrb 8s ease-in-out infinite alternate;transform-origin:200px 100px}.bg-orb-2{animation:pulseOrb 10s ease-in-out infinite alternate-reverse;transform-origin:1000px 250px}.scan-beam{animation: